services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-predictor:latest
    command: >
      python -m uvicorn src.app:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-predictor:latest
    command: >
      python -m streamlit run src/streamlit_app.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
