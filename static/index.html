<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather Predictor Accuracy</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #101827; color: #edf2f7; }
      main { width: min(960px, calc(100% - 32px)); margin: 48px auto; }
      .card { background: #1b263b; border: 1px solid #334155; border-radius: 14px; padding: 24px; }
      .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
      .metric { background: #24344d; border-radius: 10px; padding: 16px; }
      .metric strong { display: block; font-size: 1.7rem; margin-top: 6px; }
      .error { color: #fca5a5; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid #334155; }
      @media (max-width: 640px) { .metrics { grid-template-columns: 1fr; } main { margin: 24px auto; } }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Weather Predictor</h1>
        <p>Scored prediction history</p>
        <p id="status">Loading accuracy data...</p>
        <section class="metrics" aria-label="Accuracy summary">
          <div class="metric">Scored predictions<strong id="count">—</strong></div>
          <div class="metric">Average temperature error<strong id="error">—</strong></div>
          <div class="metric">Rain accuracy<strong id="rain">—</strong></div>
        </section>
        <table>
          <thead><tr><th>Date</th><th>Predicted max</th><th>Actual max</th><th>Error</th></tr></thead>
          <tbody id="history"></tbody>
        </table>
      </div>
    </main>
    <script>
      const format = (value, suffix = "") =>
        value === null || value === undefined ? "—" : `${value}${suffix}`;
      async function loadAccuracy() {
        const status = document.getElementById("status");
        status.textContent = "Loading accuracy data...";
        document.getElementById("history").replaceChildren();
        try {
          const response = await fetch("/accuracy", { cache: "no-store" });
          if (!response.ok) throw new Error(`Request failed (${response.status})`);
          const data = await response.json();
          document.getElementById("count").textContent = format(data.scored_predictions);
          document.getElementById("error").textContent = format(
            data.average_temperature_error === null
              ? null : data.average_temperature_error.toFixed(2), " °C");
          document.getElementById("rain").textContent = format(
            data.rain_accuracy === null
              ? null : `${(data.rain_accuracy * 100).toFixed(1)}%`);
          for (const item of data.history || []) {
            const row = document.createElement("tr");
            [item.prediction_for, item.predicted_temp_max, item.actual_temp_max, item.temp_error]
              .forEach(value => { const cell = document.createElement("td"); cell.textContent = format(value); row.append(cell); });
            document.getElementById("history").append(row);
          }
          status.textContent = data.scored_predictions
            ? "Metrics reflect scored predictions only." : "No scored predictions yet.";
        } catch (error) {
          status.textContent = `Unable to load accuracy data: ${error.message}`;
          status.className = "error";
        }
      }
      loadAccuracy();
    </script>
  </body>
</html>
